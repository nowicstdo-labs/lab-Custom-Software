name: astha_diagnostic
description: A premium Flutter frontend for Astha Diagnostic Laboratory Management.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.7.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  go_router: ^17.4.0
  responsive_framework: ^1.3.0
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.8
  intl: ^0.20.2
  google_sign_in: ^7.2.0
  local_auth: ^3.0.2
  shared_preferences: ^2.2.0
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
