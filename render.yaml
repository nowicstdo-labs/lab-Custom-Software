# Render Blueprint Spec for Astha Diagnostic Application
# Deploy automatically by linking your GitHub Repository on https://dashboard.render.com

services:
  # ── LIVE NESTJS BACKEND REST API ──────────────────────────────────────────
  - type: web
    name: astha-diagnostic-backend
    runtime: node
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: astha-postgres-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: "no-reply@asthadiagnostic.com"
      - key: APP_URL
        value: https://astha-diagnostic-2.onrender.com

  # ── FLUTTER WEB FRONTEND ──────────────────────────────────────────────────
  - type: web
    name: astha-diagnostic-web
    runtime: docker
    region: singapore
    plan: starter
    rootDir: frontend
    dockerfilePath: Dockerfile
    envVars:
      - key: API_BASE_URL
        value: https://astha-diagnostic-2.onrender.com/api/v1

# ── POSTGRESQL DATABASE ──────────────────────────────────────────────────────
databases:
  - name: astha-postgres-db
    databaseName: astha_db
    user: astha_admin
    region: singapore
    plan: starter
